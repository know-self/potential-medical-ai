name: CI

on:
  push:
    branches: [main, 'agent/**', 'fix/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax check server and CLI modules
        run: |
          find server knowledge-plane scripts tests bin -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: CLI self-check
        run: |
          node bin/pmai.js help
          node bin/pmai.js --help
          node bin/pmai.js doctor --json
      - name: Import MCP runtime modules
        run: node -e "await import('./knowledge-plane/mcp.js'); await import('./knowledge-plane/mcp-http.js')"
      - name: Test and evaluations
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Tests failed. Last 200 lines:"
            tail -n 200 test-output.log
            exit "$code"
          fi
          cat test-output.log
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render desktop and mobile UI
        run: npm run visual:test
      - name: Upload rendered UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rendered-ui
          path: artifacts/ui-*.png
          if-no-files-found: error
          retention-days: 14

  windows-cli-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Windows CLI syntax and help
        run: |
          node --check scripts/pmai-windows-runtime.js
          node --check scripts/service-bootstrap.js
          node bin/pmai.js help
          node bin/pmai.js doctor --json
      - name: Windows runtime regression tests
        run: node --test tests/windowsRuntime.test.js tests/custom-model-runtime.test.js
      - name: Build through direct Vite CLI
        run: node node_modules/vite/bin/vite.js build
