name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax check server modules
        run: |
          find server knowledge-plane scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Import MCP runtime modules
        run: node -e "await import('./knowledge-plane/mcp.js'); await import('./knowledge-plane/mcp-http.js')"
      - run: npm test
      - run: npm run build
